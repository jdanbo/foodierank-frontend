<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodieRank - Crear Cuenta</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <!-- Barra de Navegación Global -->
  <header>
    <div class="container nav-bar">
      <a href="index.html" class="logo">Foodie<span>Rank</span></a>
      <nav>
        <ul class="nav-links">
          <li><a href="restaurants.html">Restaurantes</a></li>
          <li id="nav-user-actions"></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Formulario de Registro -->
  <main class="container" style="display: flex; justify-content: center; align-items: center; flex: 1; padding: 40px 20px;">
    <div class="card" style="width: 100%; max-width: 480px;">
      <h2 style="font-size: 1.75rem; margin-bottom: 8px; text-align: center;">Únete a la comunidad</h2>
      <p style="color: var(--text-secondary); text-align: center; margin-bottom: 24px; font-size: 0.9rem;">
        Crea tu cuenta para compartir tus experiencias gastronómicas
      </p>

      <!-- Mensaje de feedback dinámico -->
      <div id="auth-alert" class="alert"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="nombre">Nombre Completo</label>
          <input type="text" id="nombre" class="form-control" placeholder="Tu nombre o apodo foodie" required>
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" class="form-control" placeholder="tu@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña (Mínimo 6 caracteres)</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" minlength="6" required>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          Crear Cuenta
        </button>
      </form>

      <p style="text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--text-secondary);">
        ¿Ya tienes cuenta? <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Inicia sesión</a>
      </p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
